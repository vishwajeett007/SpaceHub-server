name: Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    env:
      # Prisma validates the connection-string format without connecting to this database.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/spacehub_ci
      REDIS_URL: redis://127.0.0.1:6379
      REDIS_REQUIRED: "true"
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        run: npm run ci

  deploy:
    name: Deploy to production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: DEPLOY_PATH,HEALTHCHECK_URL,PM2_APP_NAME
          script: |
            # Node, npm and pm2 are installed through nvm, which non-interactive SSH shells do not load.
            # Source it before enabling strict mode because nvm.sh is not compatible with `set -u`.
            export NVM_DIR="$HOME/.nvm"
            . "$NVM_DIR/nvm.sh"

            set -Eeuo pipefail

            cd "$DEPLOY_PATH"
            previous_revision="$(git rev-parse HEAD)"

            git fetch --depth=1 origin main
            git checkout --force main
            git reset --hard origin/main

            npm ci
            npx prisma generate
            npx prisma migrate deploy
            npm prune --omit=dev
            pm2 restart "$PM2_APP_NAME" --update-env

            for attempt in {1..15}; do
              if curl --fail --silent --show-error "$HEALTHCHECK_URL" > /dev/null; then
                exit 0
              fi
              sleep 2
            done

            echo "Deployment health check failed; restoring the previous application revision."
            git reset --hard "$previous_revision"
            npm ci
            npx prisma generate
            npm prune --omit=dev
            pm2 restart "$PM2_APP_NAME" --update-env
            exit 1
